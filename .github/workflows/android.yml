name: Android debug
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [[ ! -f "$SDK/platforms/android-35/android.jar" || ! -x "$SDK/build-tools/35.0.0/aapt2" ]]; then
            manager="$(command -v sdkmanager || true)"
            if [[ -z "$manager" ]]; then
              manager="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
            fi
            test -x "$manager"
            "$manager" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest
      - name: Android lint
        run: gradle --no-daemon --stacktrace lintDebug
      - name: Compile Android integration tests
        run: gradle --no-daemon --stacktrace assembleDebugAndroidTest
      - name: Check unsigned release packaging
        run: gradle --no-daemon --stacktrace assembleRelease lintRelease
      - name: Enable KVM for release candidate tests
        if: github.head_ref == 'release-1.0-dev'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run database, migration and adaptive UI tests on Android
        if: github.head_ref == 'release-1.0-dev'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell settings put system show_ime_with_hard_keyboard 1
            gradle --no-daemon --stacktrace connectedDebugAndroidTest
            adb shell wm size 720x1280
            adb shell wm density 320
            adb shell settings put system font_scale 1.3
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.threebutton || true
            adb shell am force-stop ru.epbloger.zaberi
            gradle --no-daemon --stacktrace connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ru.epbloger.zaberi.AdaptiveLayoutTest
            adb shell wm size 1280x800
            adb shell wm density 160
            adb shell settings put system font_scale 1.5
            adb shell am force-stop ru.epbloger.zaberi
            gradle --no-daemon --stacktrace connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ru.epbloger.zaberi.AdaptiveLayoutTest
            adb shell wm size reset
            adb shell wm density reset
            adb shell settings put system font_scale 1.0
      - name: Verify supported older Android
        if: github.head_ref == 'release-1.0-dev'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell settings put system show_ime_with_hard_keyboard 1
            gradle --no-daemon --stacktrace connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: zaberi-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zaberi-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-*.html
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14
