name: Android debug
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [[ ! -f "$SDK/platforms/android-35/android.jar" || ! -x "$SDK/build-tools/35.0.0/aapt2" ]]; then
            manager="$(command -v sdkmanager || true)"
            if [[ -z "$manager" ]]; then
              manager="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
            fi
            test -x "$manager"
            "$manager" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest
      - name: Android lint
        run: gradle --no-daemon --stacktrace lintDebug
      - name: Compile Android integration tests
        run: gradle --no-daemon --stacktrace assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: zaberi-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
